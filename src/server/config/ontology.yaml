# 已发布配置 —— 《ontos-article.md》附录 C 全文。引擎加载的就是这份文本。
# test 空间世界（ADR 0012）：设备一生 + 办公线；人事/招聘已撤。
object_types:
  equipment:
    description: 设备
    kind: thing
    identity: serial_no
    properties:
      name:
        type: string
        description: 名称
      serial_no:
        type: string
        description: 出厂序列号
      dept:
        type: string
        description: 所属车间编号
      mark:
        type: enum
        values: [scrapped]
        description: 台账标记
      status:
        type: enum
        description: 阶段
        values:                              # key 进配置与动作字面量；label 只给人看
          - { value: in_transit, label: 在途 }
          - { value: in_service, label: 在役 }
          - { value: scrapped, label: 报废 }
        derived:                               # 不进 fields。从上到下第一条命中
          - when:
              device:
                mark: scrapped                 # 设备源有行且 mark=报废
            value: scrapped
          - when:
              purchase: true                   # 采购源必须有行
              device: false                    # 设备源必须无行
            value: in_transit
          - when:
              device: true                     # 只看设备源
            value: in_service
      in_warranty:
        type: boolean
        description: 是否在保
        derived:                               # 布尔=一条过滤
          $link:
            covered_by:
              expiry: { gte: now/d }           # 有到期日不早于今天的保修卡
    sources:
      purchase:
        connection: purchase_sys
        table: po_item
        pk: po_id                              # 表主键，不是同一性标准
        fields:
          name: item_name
          serial_no: sn
      device:
        connection: device_sys
        table: device
        pk: dev_id
        fields:
          name: name
          serial_no: serial_no
          dept: dept_id
          mark: status                         # 设备表 status 列
      asset:
        connection: asset_sys
        table: asset
        pk: asset_id
        fields:
          name: asset_name
          serial_no: sn
    axioms:
      status_one:
        description: 同一时刻一个阶段
        type: mutex
        property: status
    actions:
      convert:
        description: 验收入库
        pre:
          status: in_transit                   # 现在必须在途
          $link:
            converted: false                   # 转化尚未发生
        effect:
          - link: converted                    # 转化没有另一端；作用在请求点名的那台设备上
          - create:
              object: warranty_card
              properties:
                serial_no: { from: identity }  # 与设备序列号相同，covers 靠 match 成立
                expiry: now+1y
      transfer:
        description: 调拨
        pre:
          status: in_service
          dept: { ne: { property: dept, from: request } }  # 新车间不得等于当前
          $link:
            belongs_to: true
          $request:
            dept: { object: department }       # request.dept 必须能认到车间
        effect:
          - update:
              object: equipment
              identity: { from: identity }
              properties:
                dept: { from: request }        # 车间=请求里的车间
      scrap:
        description: 报废
        pre:
          status: in_service
        effect:
          - update:
              object: equipment
              identity: { from: identity }
              properties:
                mark: scrapped                 # 台账标记改为报废
      register:
        description: 登记
        pre:
          $exists: false                       # 各源都还没有这个序列号
          $request:
            dept: { object: department }
        effect:
          - create:
              object: equipment
              properties:
                name: { from: request }
                dept: { from: request }
                serial_no: { from: identity }  # 序列号=请求顶上的 identity
      register_assignment:
        description: 登记履历                      # 对一台全新设备登记第一条履历
        pre:
          $exists: false                       # 各源都还没有这个序列号
          $request:
            valid_from: { lte: { property: valid_to, from: request } }  # 生效日不晚于失效日；不读源
            dept_id: { object: department }    # request.dept_id 必须能认到已有车间
        effect:
          - create:
              object: assignment
              properties:
                asgn_no: { from: generated }   # 履历编号按 generate 发出，编号里含设备序列号
                serial_no: { from: identity }  # 设备序列号=请求顶上的 identity
                dept_id: { from: request }
                valid_from: { from: request }
                valid_to: { from: request }
      finish_repair:
        description: 结束维修
        pre:
          $link:
            under_repair:
              is_open: true                    # 前置在设备上，用设备出发的关系名
        effect:
          - update:
              object: repair
              filter:
                is_open: true
                serial_no: { eq: { from: identity } }   # 过滤落在维修上，用维修自己的字段
              properties:
                ended_at: now                  # 结束时刻=此刻

  department:
    description: 车间                          # 设备归属的车间/产线口径（与 OA 行政组织同形异义）
    kind: thing
    identity: dept_id
    properties:
      name:
        type: string
        description: 车间名称
      dept_id:
        type: string
        description: 车间编号
    sources:
      org:
        connection: device_sys
        table: department
        pk: dept_id
        fields:
          name: dept_name
          dept_id: dept_id

  assignment:
    description: 履历                          # 设备某段时间属于某车间。不是设备
    kind: event
    identity: asgn_no
    properties:
      asgn_no:
        type: string
        description: 履历编号
        generate:
          - { from: identity }
          - "-"
          - { date: now/d, format: yyyyMMdd }
          - "-"
          - { snowflake: true }
      serial_no:
        type: string
        description: 设备序列号
      dept_id:
        type: string
        description: 车间编号
      valid_from:
        type: date
        description: 生效日
      valid_to:
        type: date
        description: 失效日
    sources:
      history:
        connection: device_sys
        table: assignment
        pk: id
        fields:
          asgn_no: asgn_no
          serial_no: sn
          dept_id: dept_id
          valid_from: valid_from
          valid_to: valid_to

  warranty_card:
    description: 保修卡                        # 挂在设备上，不是设备自己
    kind: thing
    identity: serial_no                        # 与设备同一序列号
    properties:
      serial_no:
        type: string
        description: 出厂序列号
      expiry:
        type: date
        description: 到期日
    sources:
      cards:
        connection: asset_sys
        table: warranty_card
        pk: card_id
        fields:
          serial_no: sn
          expiry: expiry

  repair:
    description: 维修                          # 一次维修记录。不是设备
    kind: event
    identity: repair_no
    properties:
      repair_no:
        type: string
        description: 维修单号
        generate:
          - { from: identity }
          - "-"
          - { date: now/d, format: yyyyMMdd }
          - "-"
          - { snowflake: true }
      serial_no:
        type: string
        description: 设备序列号
      started_at:
        type: date
        description: 开始时刻
      ended_at:
        type: date
        description: 结束时刻
      is_open:
        type: boolean
        description: 是否未结束
        derived:
          ended_at: null                       # 结束时刻为空=未结束
    sources:
      repairs:
        connection: device_sys
        table: repair
        pk: id
        fields:
          repair_no: repair_no
          serial_no: serial_no
          started_at: started_at
          ended_at: ended_at

  instrument:
    description: 点检对象                      # 被纳入点检范围的设备清单
    kind: thing
    identity: serial_no
    properties:
      serial_no:
        type: string
        description: 设备序列号
      name:
        type: string
        description: 点检对象名称
      inspect_cycle_days:
        type: number
        description: 点检周期（天）
      last_inspect_at:
        type: date
        description: 上次点检时间
    sources:
      inspect:
        connection: inspect_sys
        table: instrument
        pk: id
        fields:
          serial_no: serial_no
          name: name
          inspect_cycle_days: inspect_cycle_days
          last_inspect_at: last_inspect_at

  it_device:
    description: 办公设备                      # 电脑/显示器等，与生产设备不是同一种东西
    kind: thing
    identity: sn                               # 与资产系统对得上号靠序列号
    properties:
      sn:
        type: string
        description: 设备序列号
      asset_tag:
        type: string
        description: 资产编号
      model:
        type: string
        description: 型号
      holder:
        type: string
        description: 领用人
      status:
        type: enum
        values: [在用, 闲置, 报废]
        description: 状态
    sources:
      it:
        connection: it_sys
        table: device
        pk: asset_tag
        fields:
          sn: sn
          asset_tag: asset_tag
          model: model
          holder: holder
          status: status

  it_ticket:
    description: IT 报修单                     # 办公设备报修，与生产维修不是同一种东西
    kind: event
    identity: ticket_no
    properties:
      ticket_no:
        type: string
        description: 报修单号
        generate:
          - { from: identity }
          - "-"
          - { date: now/d, format: yyyyMMdd }
          - "-"
          - { snowflake: true }
      asset_tag:
        type: string
        description: 资产编号
      reporter:
        type: string
        description: 报修人
      status:
        type: enum
        values: [open, closed]
        description: 状态
      opened_at:
        type: date
        description: 报修时间
      is_open:
        type: boolean
        description: 是否未关闭
        derived:
          status: open
    sources:
      it:
        connection: it_sys
        table: ticket
        pk: ticket_no
        fields:
          ticket_no: ticket_no
          asset_tag: asset_tag
          reporter: reporter
          status: status
          opened_at: opened_at

  account:
    description: 办公账号                      # 人员以账号持有者出现（无人事系统）
    kind: thing
    identity: login
    properties:
      login:
        type: string
        description: 登录名
      name:
        type: string
        description: 姓名
      email:
        type: string
        description: 邮箱
      dept_id:
        type: string
        description: 所属部门编号
      contractor:
        type: number
        description: 是否外包（0 正式 / 1 外包）
      is_contractor:
        type: boolean
        description: 是否外包
        derived:
          contractor: 1
    sources:
      oa:
        connection: oa_sys
        table: account
        pk: login
        fields:
          login: login
          name: name
          email: email
          dept_id: dept_id
          contractor: is_contractor
    actions:
      request_supply:
        description: 领用办公用品
        pre:
          $request:
            item_no: { object: supply }         # request.item_no 必须认到用品
            qty: { gte: 1 }                     # 数量至少 1
        effect:
          - create:
              object: requisition
              properties:
                req_no: { from: generated }    # 领用单号按 generate 发出
                item_no: { from: request }
                requester: { from: identity }  # 领用人=请求点名的账号登录名
                qty: { from: request }
                req_date: now/d

  card_holder:
    description: 门禁卡                        # 正式员工都有卡，外包没有（部分重叠）
    kind: thing
    identity: card_no
    properties:
      card_no:
        type: string
        description: 门禁卡号
      holder:
        type: string
        description: 持卡人
      name:
        type: string
        description: 姓名
      issued_at:
        type: date
        description: 发卡时间
    sources:
      access:
        connection: access_sys
        table: card_holder
        pk: card_no
        fields:
          card_no: card_no
          holder: holder
          name: name
          issued_at: issued_at

  oa_dept:
    description: 部门（行政组织）              # 与台账车间的部门表同形异义
    kind: thing
    identity: dept_id
    properties:
      dept_id:
        type: string
        description: 部门编号
      name:
        type: string
        description: 部门名称
    sources:
      org:
        connection: oa_sys
        table: dept
        pk: dept_id
        fields:
          dept_id: dept_id
          name: dept_name

  room:
    description: 会议室
    kind: thing
    identity: room_no
    properties:
      room_no:
        type: string
        description: 会议室编号
      name:
        type: string
        description: 会议室名称
      capacity:
        type: number
        description: 容量
    sources:
      oa:
        connection: oa_sys
        table: room
        pk: room_no
        fields:
          room_no: room_no
          name: name
          capacity: capacity
    actions:
      book_room:
        description: 预订会议室
        pre:
          $request:
            booker: { object: account }        # 预订人必须认到账号
            slot: { in: [上午, 下午] }          # 时段二选一
        effect:
          - create:
              object: booking
              properties:
                booking_no: { from: generated } # 预订编号按 generate 发出
                booker: { from: request }
                booked_date: now/d
                slot: { from: request }

  booking:
    description: 会议室预订                    # 一条预订。不是会议室
    kind: event
    identity: booking_no
    properties:
      booking_no:
        type: string
        description: 预订编号
        generate:
          - { from: identity }
          - "-"
          - { date: now/d, format: yyyyMMdd }
          - "-"
          - { snowflake: true }
      room_no:
        type: string
        description: 会议室编号
      booker:
        type: string
        description: 预订人
      booked_date:
        type: date
        description: 预订日期
      slot:
        type: enum
        values: [上午, 下午]
        description: 时段
    sources:
      oa:
        connection: oa_sys
        table: booking
        pk: booking_no
        fields:
          booking_no: booking_no
          room_no: room_no
          booker: booker
          booked_date: booked_date
          slot: slot

  supply:
    description: 办公用品
    kind: thing
    identity: item_no
    properties:
      item_no:
        type: string
        description: 用品编号
      name:
        type: string
        description: 用品名称
      stock:
        type: number
        description: 库存
    sources:
      oa:
        connection: oa_sys
        table: supply
        pk: item_no
        fields:
          item_no: item_no
          name: name
          stock: stock

  requisition:
    description: 领用单                        # 一条领用记录。不是用品
    kind: event
    identity: req_no
    properties:
      req_no:
        type: string
        description: 领用单号
        generate:
          - { from: identity }
          - "-"
          - { date: now/d, format: yyyyMMdd }
          - "-"
          - { snowflake: true }
      item_no:
        type: string
        description: 用品编号
      requester:
        type: string
        description: 领用人
      qty:
        type: number
        description: 数量
      req_date:
        type: date
        description: 领用日期
    sources:
      oa:
        connection: oa_sys
        table: requisition
        pk: req_no
        fields:
          req_no: req_no
          item_no: item_no
          requester: requester
          qty: qty
          req_date: req_date

link_types:
  converted:
    description: 转化为
    from: equipment
    to: equipment                              # 同一台设备的两个阶段
    inverse: converted_from
    card: 1:1
    transition:
      property: status
      from: in_transit
      to: in_service
  belongs_to:
    description: 属于
    from: equipment
    to: department
    inverse: has_equipment                     # 从车间查设备时写这个名字
    card: N:1
    match:
      - { from: dept, to: dept_id }
  of_equipment:
    description: 哪台设备
    from: assignment
    to: equipment
    inverse: assignments
    card: N:1
    match:
      - { from: serial_no, to: serial_no }
  of_department:
    description: 哪个车间
    from: assignment
    to: department
    inverse: has_assignments
    card: N:1
    match:
      - { from: dept_id, to: dept_id }
  covers:
    description: 保修
    from: warranty_card
    to: equipment
    inverse: covered_by
    card: N:1
    match:
      - { from: serial_no, to: serial_no }
  on_equipment:
    description: 维修哪台
    from: repair
    to: equipment
    inverse: under_repair                      # 从设备查维修时写这个名字
    card: N:1
    match:
      - { from: serial_no, to: serial_no }
  inspect_of:
    description: 点检哪台
    from: instrument
    to: equipment
    inverse: inspected_by
    card: N:1
    match:
      - { from: serial_no, to: serial_no }
  held_by:
    description: 报修哪台                        # IT 报修单 → 办公设备。不是保留字
    from: it_ticket
    to: it_device
    inverse: tickets
    card: N:1
    match:
      - { from: asset_tag, to: asset_tag }
  card_of:
    description: 谁的卡
    from: card_holder
    to: account
    inverse: cards
    card: N:1
    match:
      - { from: holder, to: login }
  of_dept:
    description: 属于哪个部门
    from: account
    to: oa_dept
    inverse: accounts
    card: N:1
    match:
      - { from: dept_id, to: dept_id }
  booked_at:
    description: 订了哪间
    from: booking
    to: room
    inverse: bookings
    card: N:1
    match:
      - { from: room_no, to: room_no }
  booked_by:
    description: 谁订的
    from: booking
    to: account
    inverse: my_bookings
    card: N:1
    match:
      - { from: booker, to: login }
  requisition_of:
    description: 领了什么
    from: requisition
    to: supply
    inverse: requisitions
    card: N:1
    match:
      - { from: item_no, to: item_no }
  raised_by:
    description: 谁领的
    from: requisition
    to: account
    inverse: my_requisitions
    card: N:1
    match:
      - { from: requester, to: login }
